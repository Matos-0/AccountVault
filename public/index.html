<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Vault</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="container">
        <div class="header-actions">
            <h1>Account Vault</h1>
            <a href="create.html" class="btn-primary link-btn">New Domain</a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Domain</th>
                        <th>E-mail</th>
                        <th>User</th>
                        <th>Password</th>
                        <th>Additional Info</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="accountsTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #7c7c8a;">Loading Accounts...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/index.js"></script>
